<style>
/* 設計系統：Brutalism（ui-ux-pro-max --design-system 選出）
   硬邊框、零圓角、粗字、可見網格、非對稱。色票取自 "Coin gold + prestige purple"：
   金＝錢與跑道，紫＝有證據支持的做法，紅＝命中失敗模式。
   刻意偏離資料集的一點：資料集寫 transition:none，這裡保留 90–180ms 的功能性轉場，
   因為按壓回饋與狀態變化不該用瞬切（Quick Ref §2 press-feedback、§7 state-transition），

:root{
  color-scheme:light;
  --paper:#FFFBEB; --paper-2:#FFFFFF; --ink:#0F172A; --ink-2:#475569;
  --rule:#0F172A; --rule-soft:#E8DFC6;
  --gold:#D97706; --gold-ink:#92400E; --gold-wash:#FDF3D7;
  --violet:#7C3AED; --violet-ink:#5B21B6; --violet-wash:#F2ECFE;
  --danger:#DC2626; --danger-ink:#991B1B; --danger-wash:#FDEBEB;
  --on-solid:#FFFFFF;
  --bar:#92400E; --bar-danger:#991B1B; --bar-violet:#5B21B6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --t-xs:12px; --t-s:14px; --t-b:16px; --t-m:19px; --t-l:26px; --t-xl:40px;
  --sp-1:4px; --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:32px; --sp-6:48px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --paper:#0D0C0A; --paper-2:#161310; --ink:#F5F1E6; --ink-2:#ABA493;
  --rule:#756B58; --rule-soft:#2A251E;
  --gold:#F0A62B; --gold-ink:#F0A62B; --gold-wash:#241B0B;
  --violet:#A78BFA; --violet-ink:#C4B5FD; --violet-wash:#1B1530;
  --danger:#F87171; --danger-ink:#FCA5A5; --danger-wash:#2A1414;
  --on-solid:#0D0C0A;
  --bar:#F0A62B; --bar-danger:#F87171; --bar-violet:#A78BFA;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:var(--t-b)/1.7 var(--sans);overflow-wrap:anywhere}
.shell{max-width:1080px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-6)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}
.skip:focus{position:static;display:inline-block;margin-bottom:var(--sp-2)}

a{color:var(--gold-ink)}
.ico{flex:none;vertical-align:-2px}

/* ── 開場 ─────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-4);
  align-items:center;margin-bottom:var(--sp-5)}
.hero .big{font:900 clamp(72px,16vw,150px)/.78 var(--mono);letter-spacing:-.04em;color:var(--gold)}
.hero h1{font:900 var(--t-xl)/1.15 var(--sans);letter-spacing:-.01em;margin:0 0 var(--sp-2)}
.hero p{margin:0;color:var(--ink-2);max-width:52ch}
.slab{border:2px solid var(--rule);background:var(--paper-2);position:relative;
  padding:var(--sp-4);margin:0 0 var(--sp-5)}
.slab>.label{position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--paper);
  font:700 var(--t-xs)/1 var(--mono);letter-spacing:.14em;padding:6px 10px;text-transform:uppercase}
.slab ul{margin:var(--sp-3) 0 0;padding-left:1.15em}

.slab li strong{color:var(--ink)}
h2.sec{font:800 var(--t-l)/1.2 var(--sans);letter-spacing:-.01em;margin:0 0 var(--sp-3)}
.startnote{color:var(--ink-2);font-size:var(--t-s);max-width:56ch;margin:var(--sp-4) 0 0}
.share textarea{width:100%;margin:var(--sp-3) 0 0;background:var(--paper);color:var(--ink);
  border:2px solid var(--rule);padding:var(--sp-3);resize:vertical;
  font:var(--t-s)/1.7 var(--sans);border-radius:0}
.share .row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-top:var(--sp-3)}
.share .ghost{display:inline-flex;align-items:center;gap:var(--sp-2);background:transparent;
  color:var(--ink);border:2px solid var(--rule);padding:12px var(--sp-4);font-weight:800;
  min-height:44px;text-decoration:none;
  transition:transform .09s ease-out,box-shadow .09s ease-out}
.share .ghost:hover,.share .ghost:focus-visible{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--gold)}
.share .ghost:active{transform:none;box-shadow:none}
.share .said{font:500 var(--t-xs)/1.6 var(--mono);color:var(--violet-ink)}
.next.big{font-size:var(--t-m);padding:16px var(--sp-5)}
.rail .tk{border-bottom:2px solid var(--rule);padding-bottom:var(--sp-2);margin-bottom:var(--sp-3)}
.rail .tk b{display:block;font:800 var(--t-m)/1.3 var(--sans)}
.rail .tk span{display:block;font-size:var(--t-xs);color:var(--ink-2);line-height:1.5}

/* ── 回合：左側狀態軌 + 右側舞台 ───────────────────────── */
.round-grid{display:grid;grid-template-columns:268px minmax(0,1fr);gap:var(--sp-3);align-items:start}
.rail{border:2px solid var(--rule);background:var(--paper-2);padding:var(--sp-3);
  position:sticky;top:var(--sp-3)}
.ticker{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:var(--sp-2)}
.ticker i{display:block;height:10px;background:var(--rule-soft);transition:background .2s}
.ticker i.on{background:var(--ink)}
.ticker i.now{background:var(--gold)}
.rail .mo{font:700 var(--t-xs)/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 var(--sp-3)}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);
  padding:var(--sp-2) 0;border-top:1px solid var(--rule-soft)}
.stat span{font:500 var(--t-xs)/1.4 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2)}
.stat b{font:800 var(--t-m)/1 var(--mono);font-variant-numeric:tabular-nums}
.flash{min-height:26px;display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;
  padding-top:var(--sp-2);font:700 var(--t-xs)/1.5 var(--mono);font-variant-numeric:tabular-nums}
.flash.on{animation:flash 2s ease-out forwards}
.flash .up{color:var(--violet-ink)} .flash .down{color:var(--danger-ink)}
.flash .tag2{color:var(--ink-2);font-weight:500;letter-spacing:.1em}
@keyframes flash{0%{opacity:0;transform:translateY(8px)}
  12%{opacity:1;transform:none} 72%{opacity:1;transform:none} 100%{opacity:0}}
.rail .runway{border-top:2px solid var(--rule);margin-top:var(--sp-2);padding-top:var(--sp-3)}
.rlabel{display:block;font:500 var(--t-xs)/1.4 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2)}
.rail .runway .big{font:900 var(--t-xl)/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--gold)}
.rail .runway.low .big{color:var(--gold)}
.rail .runway.crit .big{color:var(--danger)}
.bar{height:10px;background:var(--rule-soft);margin:var(--sp-2) 0}
.bar>i{display:block;height:100%;background:var(--bar);transition:width .3s ease-out}
.runway.crit .bar>i{background:var(--bar-danger)}
.math{font:500 var(--t-xs)/1.6 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-2);margin:0}
.math em{font-style:normal;color:var(--ink)}

.stage{min-width:0}
.warn{display:flex;gap:var(--sp-2);background:var(--danger-wash);border:2px solid var(--danger);
  color:var(--danger-ink);padding:var(--sp-2) var(--sp-3);font-size:var(--t-s);
  font-weight:600;margin:0 0 var(--sp-3)}
.scene-block{border:2px solid var(--rule);background:var(--paper-2);
  padding:var(--sp-4);margin:0 0 var(--sp-3)}
.scene-title{font:800 var(--t-l)/1.3 var(--sans);letter-spacing:-.01em;margin:0 0 var(--sp-3);
  max-width:24ch;text-wrap:balance}
.scene{white-space:pre-line;margin:0;max-width:60ch;color:var(--ink)}
.opts{display:grid;gap:var(--sp-2)}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--sp-3);align-items:start;
  width:100%;text-align:left;background:var(--paper-2);border:2px solid var(--rule);
  padding:13px var(--sp-3);min-height:52px;
  transition:transform .09s ease-out,box-shadow .09s ease-out}
.opt:hover,.opt:focus-visible{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--violet)}
.opt:active{transform:none;box-shadow:none}
.opt[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
.opt kbd{font:700 var(--t-s)/30px var(--mono);height:30px;text-align:center;
  background:var(--ink);color:var(--paper)}

/* ── 回饋卡 ───────────────────────────────────────────── */
.fb{border:2px solid var(--rule);border-left-width:10px;background:var(--paper-2);
  margin-top:var(--sp-3);animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fb.good{border-left-color:var(--violet)}
.fb.ok{border-left-color:var(--gold)}
.fb.bad,.fb.kill{border-left-color:var(--danger)}
.fb-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);
  border-bottom:2px solid var(--rule);font:800 var(--t-b)/1 var(--sans)}
.fb.good .fb-head{color:var(--violet-ink);background:var(--violet-wash)}
.fb.ok .fb-head{color:var(--gold-ink);background:var(--gold-wash)}
.fb.bad .fb-head,.fb.kill .fb-head{color:var(--danger-ink);background:var(--danger-wash)}
.fb-body{padding:var(--sp-4)}
.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  gap:var(--sp-2);margin:0 0 var(--sp-4)}
.delta{border:1px solid var(--rule-soft);padding:var(--sp-2)}
.delta span{display:block;font:500 var(--t-xs)/1.4 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}
.delta b{font:800 var(--t-m)/1.2 var(--mono);font-variant-numeric:tabular-nums}
.delta b.up{color:var(--violet-ink)} .delta b.down{color:var(--danger-ink)}
.pat{margin:0}
.pat .chap{font:700 var(--t-xs)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 var(--sp-2)}
.pat .pname{font:800 var(--t-m)/1.4 var(--sans);margin:0 0 var(--sp-3)}
.scale{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-3);
  align-items:center;margin:0 0 var(--sp-2)}
.scale .n{font:900 var(--t-xl)/1 var(--mono);font-variant-numeric:tabular-nums}
.fb.bad .scale .n,.fb.kill .scale .n{color:var(--danger-ink)}
.fb.good .scale .n,.fb.ok .scale .n{color:var(--violet-ink)}
.scale .meta{font-size:var(--t-s);color:var(--ink-2)}
.scale .track2{height:8px;background:var(--rule-soft);margin-top:var(--sp-1)}
.scale .track2 i{display:block;height:100%;background:var(--bar-danger)}
.fb.good .scale .track2 i,.fb.ok .scale .track2 i{background:var(--bar-violet)}
.caution{display:flex;gap:var(--sp-2);border:1px solid var(--gold);background:var(--gold-wash);
  color:var(--gold-ink);padding:var(--sp-2) var(--sp-3);font-size:var(--t-s);margin:var(--sp-3) 0 0}
.cases{list-style:none;margin:var(--sp-3) 0 0;padding:0}
.case{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-3);
  border-top:1px solid var(--rule-soft);padding:var(--sp-2) 0;font-size:var(--t-s)}
.case a{font-family:var(--mono);font-size:var(--t-xs);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-bottom:1px solid currentColor}
.case span{color:var(--ink-2)}
.lesson{font-size:var(--t-s);color:var(--ink);border-left:3px solid var(--rule-soft);
  padding-left:var(--sp-3);margin:var(--sp-3) 0 0}
.origin{font:500 var(--t-xs)/1.6 var(--mono);color:var(--ink-2);margin:var(--sp-3) 0 0}
.next{display:inline-flex;align-items:center;gap:var(--sp-2);background:var(--ink);
  color:var(--paper);border:2px solid var(--ink);padding:12px var(--sp-4);
  font-weight:800;margin:var(--sp-4) 0 0;min-height:44px;
  transition:transform .09s ease-out,box-shadow .09s ease-out}
.next:hover,.next:focus-visible{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--gold)}
.next:active{transform:none;box-shadow:none}

/* ── 結局 ─────────────────────────────────────────────── */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-4);align-items:center;
  border:2px solid var(--rule);background:var(--paper-2);padding:var(--sp-4);margin:0 0 var(--sp-3)}
.verdict .g{font:900 clamp(52px,10vw,86px)/.8 var(--mono);text-align:center;
  border:3px solid var(--rule);padding:var(--sp-3) var(--sp-2);min-width:1.7em}
.verdict.dead .g{color:var(--danger);border-color:var(--danger)}
.verdict.win .g{color:var(--gold);border-color:var(--gold)}
.verdict h3{font:800 var(--t-l)/1.25 var(--sans);letter-spacing:-.01em;margin:0 0 var(--sp-2)}
.verdict p{margin:0;color:var(--ink-2)}
.finals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--rule);border:2px solid var(--rule);margin:var(--sp-3) 0 0}
.finals div{background:var(--paper-2);padding:var(--sp-2) var(--sp-3)}
.finals span{display:block;font:500 var(--t-xs)/1.4 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}
.finals b{font:800 var(--t-m)/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);margin:0 0 var(--sp-3)}
.tally div{border:2px solid var(--rule);background:var(--paper-2);padding:var(--sp-3)}
.tally b{display:block;font:900 var(--t-xl)/1 var(--mono)}
.tally.hit b{color:var(--danger-ink)} .tally .win b{color:var(--violet-ink)}
.tally span{font:500 var(--t-xs)/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.wins{list-style:none;margin:0;padding:0}
.wins li{border-top:1px solid var(--rule-soft);padding:var(--sp-2) 0;font-size:var(--t-s)}
.wins .how{display:block;color:var(--ink-2);font-size:var(--t-xs);font-family:var(--mono);margin-top:2px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:46px 18px minmax(0,1fr);gap:var(--sp-3);
  border-top:1px solid var(--rule-soft);padding:var(--sp-3) 0}
.log .mo2{font:700 var(--t-xs)/1.7 var(--mono);color:var(--ink-2)}
.log .qt{display:block;font-size:var(--t-xs);color:var(--ink-2);margin-bottom:2px}
.log .pt{display:block;font:500 var(--t-xs)/1.6 var(--mono);color:var(--ink-2);margin-top:3px}
.log .good{color:var(--violet-ink)} .log .bad{color:var(--danger-ink)} .log .ok{color:var(--ink-2)}
pre{white-space:pre-wrap;font:13px/1.6 var(--mono);background:var(--paper-2);
  border:2px solid var(--rule);padding:var(--sp-3);overflow:auto}
footer{color:var(--ink-2);font-size:var(--t-xs);font-family:var(--mono);line-height:1.7;
  border-top:2px solid var(--rule);margin-top:var(--sp-6);padding-top:var(--sp-3)}

@media(max-width:900px){
  .round-grid{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .hero{grid-template-columns:minmax(0,1fr);gap:var(--sp-2)}
}
@media(max-width:640px){
  .shell{padding:var(--sp-3) var(--sp-3) var(--sp-5)}
  .tally{grid-template-columns:minmax(0,1fr)}
  .scene-block{padding:var(--sp-3)}
  .fb-body{padding:var(--sp-3)}
  .verdict{grid-template-columns:minmax(0,1fr);gap:var(--sp-3)}
  .verdict .g{justify-self:start;min-width:0;padding:var(--sp-2) var(--sp-4)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .opt:hover,.opt:focus-visible,.next:hover,.next:focus-visible{transform:none}
  /* animation-duration 被壓成 .01ms 後，forwards 會停在 opacity:0，變化行等於沒出現。
     關掉動畫、維持可見，改由那個 2 秒 timeout 收掉。 */
  .flash.on{animation:none!important;opacity:1}
}
</style>

<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const BANK = JSON.parse($('bank').textContent);
  const nf = new Intl.NumberFormat('zh-Hant');
  const money = n => '$' + nf.format(Math.round(n));
  const PHASE_MONTHS = {1:[1,2,3], 2:[4,5,6,7], 3:[8,9,10], 4:[11,12]};
  const TIER_LABEL = {good:'有證據支持', ok:'沒踩雷，但錯過時機', bad:'命中失敗模式', kill:'一次結束'};
  const KIND_LABEL = {success:'成功模式', selfcheck:'自我檢查問題', lesson:'當事人教訓'};

  function node(tag, value, className) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (value !== undefined && value !== null) el.textContent = value;
    return el;
  }

  // 內嵌 SVG（Lucide 幾何），不是 emoji：emoji 跨平台字形不一致、也吃不到 currentColor。
  // 每個圖示旁邊都有可見文字，所以一律 aria-hidden。
  const NS = 'http://www.w3.org/2000/svg';
  const ICON = {
    check: 'M20 6 9 17l-5-5',
    x: 'M18 6 6 18M6 6l12 12',
    minus: 'M5 12h14',
    alert: 'm10.29 3.86-8.18 14a2 2 0 0 0 1.71 3h16.36a2 2 0 0 0 1.71-3l-8.18-14a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
    dead: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM4.93 4.93l14.14 14.14',
    link: 'M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6',
    arrow: 'M5 12h14M13 6l6 6-6 6'
  };
  const TIER_ICON = {good: 'check', ok: 'minus', bad: 'x', kill: 'dead'};

  function icon(name, size) {
    const svg = document.createElementNS(NS, 'svg');
    for (const [k, v] of [['viewBox', '0 0 24 24'], ['width', size || 16], ['height', size || 16],
                          ['fill', 'none'], ['stroke', 'currentColor'], ['stroke-width', '1.75'],
                          ['stroke-linecap', 'round'], ['stroke-linejoin', 'round'],
                          ['aria-hidden', 'true'], ['focusable', 'false'], ['class', 'ico']])
      svg.setAttribute(k, v);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', ICON[name]);
    svg.appendChild(path);
    return svg;
  }

  // 人數長條的基準＝題庫裡最大的那個模式，不寫死數字，換題庫也不會漂。
  const MAXN = BANK.questions.reduce((m, q) => q.options.reduce(
    (a, o) => Math.max(a, ((o.src || o.ref) || {}).n || 0), m), 1);

  // --- 經濟模型 -------------------------------------------------------------
  // 跑道是衍生值，不是可以直接加減的數字。用戶帶著成本尾巴（unit），所以
  // 「用戶變多」不一定是好事 —— 定價／成本 模式1（41 人）就是這條算式。
  function settle(s, d) {
    d = d || {};
    s.cash  += d.cash  || 0;
    s.fixed += d.fixed || 0;
    s.churn  = Math.min(40, Math.max(2, s.churn + (d.churn || 0)));
    const churned = Math.round(s.users * s.churn / 100);
    s.users = Math.max(0, s.users - churned + (d.users || 0));
    s.mrr   = Math.max(0, s.mrr + (d.mrr || 0));
    const infra = Math.ceil(s.users * s.unit);
    const burn  = s.fixed + infra;
    s.cash += s.mrr - burn;
    return {churned, infra, burn, net: s.mrr - burn};
  }
  const runwayOf = (s, burn) => burn > s.mrr ? Math.floor(s.cash / (burn - s.mrr)) : Infinity;

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor((rnd || Math.random)() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  const eligible = (phase, track, flags) => BANK.questions.filter(q =>
    q.phase === phase &&
    (!q.tracks || q.tracks.indexOf(track) >= 0) &&
    (!q.requires || flags.has(q.requires)));

  const MONTH_PHASE = {};
  for (const ph of [1,2,3,4]) for (const m of PHASE_MONTHS[ph]) MONTH_PHASE[m] = ph;

  // 逐月現抽而不是開局排好：旗標是中途才點亮的，現抽才看得到被解鎖的後果題。
  function pickQuestion(month, track, flags, used) {
    const pool = eligible(MONTH_PHASE[month], track, flags).filter(q => !used.has(q.id));
    const unlocked = pool.filter(q => q.requires);
    return (unlocked.length ? unlocked : shuffle(pool))[0] || null;
  }

  // --- 狀態 -----------------------------------------------------------------
  let S = null;

  function newGame(trackKey) {
    trackKey = trackKey || shuffle(Object.keys(BANK.tracks))[0];
    const t = BANK.tracks[trackKey];
    S = {track: trackKey, tname: t.name, unit: t.unit,
         cash: t.cash, users: t.users, mrr: t.mrr, fixed: t.fixed, churn: t.churn,
         sub: t.sub, fixedNote: t.fixedNote, month: 0, flags: new Set(), log: [], used: new Set(), dead: null};
    show('round');
    nextMonth();
  }

  function nextMonth(delta) {
    if (S.dead || S.month >= 12) return ending();
    S.month++;
    const q = pickQuestion(S.month, S.track, S.flags, S.used);
    if (!q) return ending();
    S.used.add(q.id);
    renderRail(delta);
    renderQuestion(q);
  }

  // --- 畫面 -----------------------------------------------------------------
  function show(which) {
    for (const id of ['start','round','ending','selftest']) $(id).hidden = (id !== which);
  }

  function renderRail(delta) {
    const infra = Math.ceil(S.users * S.unit);
    const burn = S.fixed + infra;
    const rw = runwayOf(S, burn);
    const rail = $('rail');
    rail.textContent = '';

    const tk = node('div', null, 'tk');
    tk.appendChild(node('b', S.tname));
    tk.appendChild(node('span', S.sub));
    rail.appendChild(tk);

    const tick = node('div', null, 'ticker');
    for (let m = 1; m <= 12; m++)
      tick.appendChild(node('i', null, m < S.month ? 'on' : m === S.month ? 'now' : ''));
    rail.appendChild(tick);
    rail.appendChild(node('p', `第 ${S.month} 個月 / 共 12 個月`, 'mo'));

    for (const [k, v] of [['現金', money(S.cash)], ['用戶', nf.format(S.users)],
                          ['MRR', money(S.mrr)], ['月流失', S.churn + '%']]) {
      const row = node('div', null, 'stat');
      row.appendChild(node('span', k));
      row.appendChild(node('b', v));
      rail.appendChild(row);
    }

    // 本月變化：固定佔位，有變化才播動畫，2 秒後用 timeout 收掉——
    // 不靠 animationend，reduced-motion 把動畫關掉時才不會永遠留在畫面上。
    const flash = node('div', null, 'flash');
    if (delta) {
      flash.classList.add('on');
      flash.appendChild(node('span', '本月', 'tag2'));
      for (const [k, v, fmt] of [['現金', delta.cash, money], ['用戶', delta.users, n => nf.format(n)],
                                 ['MRR', delta.mrr, money]]) {
        if (!v) continue;
        flash.appendChild(node('span', `${k} ${v > 0 ? '+' : '−'}${fmt(Math.abs(v))}`,
          v > 0 ? 'up' : 'down'));
      }
      // 流失是人數不是增減，加正負號會讀成「流失變少了」
      if (delta.churned) flash.appendChild(node('span', `流失 ${nf.format(delta.churned)} 人`, 'down'));
      setTimeout(() => flash.remove(), 2000);
    }
    rail.appendChild(flash);

    const box = node('div', null,
      'runway' + (rw === Infinity || rw >= 6 ? '' : rw >= 3 ? ' low' : ' crit'));
    box.appendChild(node('span', '跑道', 'rlabel'));
    box.appendChild(node('div', rw === Infinity ? '∞' : rw + ' 個月', 'big'));
    const bar = node('div', null, 'bar');
    const fill = node('i');
    fill.style.width = Math.max(2, Math.min(100, rw === Infinity ? 100 : rw / 12 * 100)) + '%';
    bar.appendChild(fill);
    box.appendChild(bar);
    const math = node('p', null, 'math');
    if (rw === Infinity) {
      math.appendChild(node('span', `月支出 ${money(burn)} 已經低於 MRR ${money(S.mrr)}，跑道無限`));
    } else {
      math.appendChild(node('em', `${money(S.cash)} ÷ (${money(burn)} − ${money(S.mrr)})`));
      math.appendChild(node('br'));
      math.appendChild(node('span', `月支出 = 固定 ${money(S.fixed)} + 基礎設施 ${money(infra)}`));
    }
    box.appendChild(math);
    rail.appendChild(box);
  }

  function renderQuestion(q) {
    $('warnBox').textContent = '';
    if (q.warn) {
      const w = node('p', null, 'warn');
      w.appendChild(icon('alert'));
      w.appendChild(node('span', q.warn));
      $('warnBox').appendChild(w);
    }
    $('sceneTitle').textContent = q.title;
    $('scene').textContent = q.scene;
    const box = $('opts');
    box.textContent = '';
    shuffle(q.options).forEach((opt, i) => {
      const b = node('button', null, 'opt');
      b.type = 'button';
      b.appendChild(node('kbd', String(i + 1)));
      b.appendChild(node('span', opt.text));
      b.setAttribute('aria-keyshortcuts', String(i + 1));
      b.addEventListener('click', () => choose(q, opt));
      box.appendChild(b);
    });
  }

  function choose(q, opt) {
    for (const b of $('opts').querySelectorAll('button')) b.disabled = true;
    if (opt.flag) S.flags.add(opt.flag);

    let delta = null;
    if (opt.tier === 'kill') {
      S.dead = {month: S.month, why: 'kill', ref: opt.ref};
      S.mrr = 0; S.users = 0;
    } else {
      const acct = settle(S, opt.d);
      if (S.cash < 0) S.dead = {month: S.month, why: 'runway', ref: opt.ref || null};
      delta = {cash: acct.net + (opt.d && opt.d.cash || 0),
               users: (opt.d && opt.d.users || 0) - acct.churned,
               mrr: opt.d && opt.d.mrr || 0, churned: acct.churned};
    }
    S.log.push({month: S.month, qid: q.id, title: q.title, text: opt.text, tier: opt.tier,
                ref: opt.ref || null, src: opt.src || null, lesson: opt.lesson || null});

    if (S.dead || S.month >= 12) return ending();
    nextMonth(delta);
  }

  function refBlock(r, isWin) {
    const wrap = node('div', null, 'pat');
    wrap.appendChild(node('p', `${r.ch} · ${r.pat}`, 'chap'));
    wrap.appendChild(node('p', r.name, 'pname'));

    // 長條就是比例本身：成功模式填「N 人裡有幾人走得更遠」，失敗模式填「相對最大模式的份量」。
    const sc = node('div', null, 'scale');
    const frac = isWin && r.up !== undefined ? r.up / r.n : r.n / MAXN;
    sc.appendChild(node('div', nf.format(r.n), 'n'));
    const right = node('div');
    right.appendChild(node('div', isWin
      ? (r.up === undefined ? `人用過這個做法` :
         `人用過，其中 ${r.up} 人走得比「有人付過錢」更遠（${Math.round(100 * r.up / r.n)}%）`)
      : `人踩過（不含低信任來源）。資料中最大的模式是 ${MAXN} 人`, 'meta'));
    const t2 = node('div', null, 'track2');
    const f2 = node('i');
    f2.style.width = Math.max(2, Math.round(frac * 100)) + '%';
    t2.appendChild(f2);
    right.appendChild(t2);
    sc.appendChild(right);
    wrap.appendChild(sc);

    if (r.caution) {
      const c = node('div', null, 'caution');
      c.appendChild(icon('alert'));
      c.appendChild(node('span', r.caution));
      wrap.appendChild(c);
    }

    const ul = node('ul', null, 'cases');
    for (const [id, gist] of r.cases) {
      const li = node('li', null, 'case');
      const a = node('a');
      a.href = 'https://www.reddit.com/comments/' + id.split(':')[0];
      a.rel = 'noopener noreferrer';
      a.target = '_blank';
      a.appendChild(node('span', id));
      a.appendChild(icon('link', 12));
      const cell = node('div');
      cell.appendChild(a);
      li.appendChild(cell);
      li.appendChild(node('span', gist));
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
    return wrap;
  }

  // --- 結局 -----------------------------------------------------------------
  function grade() {
    if (S.dead) return {t: S.dead.why === 'kill' ? '一次結束' : '倒閉', g: 'X'};
    if (S.mrr < S.fixed * 0.25) return {t: 'D · 還活著，但沒有訊號', g: 'D'};
    if (S.mrr < S.fixed)        return {t: 'C · 有付費訊號，還在補貼自己', g: 'C'};
    if (S.mrr < 5000)           return {t: 'B · 產品養得起自己', g: 'B'};
    return {t: 'A · 覆蓋生活費', g: 'A'};
  }

  function ending() {
    show('ending');
    const box = $('endBody');
    box.textContent = '';
    const g = grade();

    const v = node('div', null, 'verdict ' + (S.dead ? 'dead' : g.g === 'A' || g.g === 'B' ? 'win' : ''));
    v.appendChild(node('div', g.g, 'g'));
    const right = node('div');
    right.appendChild(node('h3', g.t));
    if (S.dead) {
      right.appendChild(node('p', S.dead.why === 'kill'
        ? `第 ${S.dead.month} 個月。不是慢慢燒完的，是一次結束的。`
        : `第 ${S.dead.month} 個月，現金見底。`));
    } else {
      right.appendChild(node('p', '撐過 12 個月。'));
      const f = node('div', null, 'finals');
      for (const [k, val] of [['現金', money(S.cash)], ['用戶', nf.format(S.users)],
                              ['MRR', money(S.mrr)], ['月固定支出', money(S.fixed)]]) {
        const c = node('div');
        c.appendChild(node('span', k));
        c.appendChild(node('b', val));
        f.appendChild(c);
      }
      right.appendChild(f);
      if (g.g === 'A') right.appendChild(node('p',
        '$5,000 這條線來自〈執行資源不足 模式2〉裡當事人自己的建議：在 MRR 穩定覆蓋生活費之前不該辭去全職工作。',
        'origin'));
    }
    v.appendChild(right);
    box.appendChild(v);

    const hits = S.log.filter(l => l.tier === 'bad' || l.tier === 'kill');
    const wins = S.log.filter(l => l.tier === 'good');

    const tally = node('div', null, 'tally');
    const t1 = node('div', null, 'hit');
    t1.appendChild(node('b', String(hits.length)));
    t1.appendChild(node('span', '命中的失敗模式'));
    const t2 = node('div', null, 'win');
    t2.appendChild(node('b', String(wins.length)));
    t2.appendChild(node('span', '有證據支持的決定'));
    tally.appendChild(t1);
    tally.appendChild(t2);
    box.appendChild(tally);

    const ex = explainBlock();
    if (ex) box.appendChild(ex);

    if (wins.length) {
      const sum = node('div', null, 'slab');
      sum.appendChild(node('span', '你做對的事', 'label'));
      const ul = node('ul', null, 'wins');
      ul.style.marginTop = 'var(--sp-3)';
      for (const w of wins) {
        const li = node('li');
        li.appendChild(node('span', w.text));
        if (w.src) {
          const sc = w.src;
          li.appendChild(node('span', `${KIND_LABEL[sc.kind]}〈${sc.ch} ${sc.pat}〉${sc.name}` +
            (sc.kind === 'success' && sc.up !== undefined
              ? `　${sc.n} 人用過，${sc.up} 人走得更遠（${Math.round(100 * sc.up / sc.n)}%）` : ''), 'how'));
        }
        ul.appendChild(li);
      }
      sum.appendChild(ul);
      box.appendChild(sum);
    }

    const warn = node('div', null, 'slab');
    warn.appendChild(node('span', '百分比讀之前', 'label'));
    const wl = node('ul');
    for (const t of [
      '分母全部很小（5–17 人）。任何一格波動一個人，百分比就差 10–20 個百分點。',
      '跨章節比較無效：同一件事「解決自己的問題」在〈驗證 模式1〉是 30 人 / 1 人升級（3%），在〈產品 模式1〉是 12 人 / 5 人升級（42%）。',
      '因果方向分不出來：敢漲價的人，可能本來就已經有穩定付費客戶。',
      '倖存者偏差在分子和分母都在。走到出售的人比較有動機發文，停在 $50 MRR 的人不會。'
    ]) wl.appendChild(node('li', t));
    warn.appendChild(wl);
    box.appendChild(warn);

    const logCard = node('div', null, 'slab');
    logCard.appendChild(node('span', '這 12 個月', 'label'));
    const ol = node('ul', null, 'log');
    ol.style.marginTop = 'var(--sp-3)';
    for (const l of S.log) {
      const li = node('li');
      li.appendChild(node('div', String(l.month).padStart(2, '0') + ' 月', 'mo2'));
      const mark = node('div', null, l.tier === 'good' ? 'good' : l.tier === 'ok' ? 'ok' : 'bad');
      mark.appendChild(icon(TIER_ICON[l.tier], 16));
      li.appendChild(mark);
      const cell = node('div');
      cell.appendChild(node('span', l.title, 'qt'));
      cell.appendChild(node('span', l.text));
      const r = l.src || l.ref;
      if (r) {
        const pt = node('span', null, 'pt');
        pt.appendChild(node('span', `${r.ch} ${r.pat}　`));
        const a = node('a', r.cases[0][0]);
        a.href = 'https://www.reddit.com/comments/' + r.cases[0][0].split(':')[0];
        a.rel = 'noopener noreferrer';
        a.target = '_blank';
        pt.appendChild(a);
        cell.appendChild(pt);
      }
      li.appendChild(cell);
      ol.appendChild(li);
    }
    logCard.appendChild(ol);
    box.appendChild(logCard);

    box.appendChild(shareBlock());

    const again = node('button', null, 'next');
    again.type = 'button';
    again.appendChild(node('span', '再玩一次'));
    again.appendChild(icon('arrow'));
    again.addEventListener('click', () => { S = null; show('start'); $('startBtn').focus(); });
    box.appendChild(again);
  }

  function explainBlock() {
    const wrongs = S.log.filter(l => (l.tier === 'bad' || l.tier === 'kill') && l.ref);
    if (!wrongs.length) return null;
    const wrap = node('div', null, 'slab');
    wrap.appendChild(node('span', '你選錯的題', 'label'));
    const list = node('div');
    list.style.marginTop = 'var(--sp-3)';
    for (const l of wrongs) {
      const item = node('div', null, 'fb ' + l.tier);
      const h = node('h3', null, 'fb-head');
      h.appendChild(icon(TIER_ICON[l.tier], 20));
      h.appendChild(node('span', `第 ${l.month} 個月 · ${l.title}`));
      item.appendChild(h);
      const b = node('div', null, 'fb-body');
      b.appendChild(node('p', '你選了：' + l.text, 'lesson'));
      b.appendChild(refBlock(l.ref, false));
      if (l.lesson) b.appendChild(node('p', l.lesson, 'lesson'));
      item.appendChild(b);
      item.style.marginBottom = 'var(--sp-3)';
      list.appendChild(item);
    }
    wrap.appendChild(list);
    return wrap;
  }

  // 給 Threads 用的成績單。網址取 location，部署到哪就是哪，不寫死。
  function shareText() {
    const hits = S.log.filter(l => l.tier === 'bad' || l.tier === 'kill');
    const worst = hits.map(l => l.ref).filter(Boolean).sort((a, b) => b.n - a.n)[0];
    const head = S.dead
      ? `我在第 ${S.dead.month} 個月倒閉。`
      : `我撐過 12 個月，最後 MRR ${money(S.mrr)}。`;
    const mid = worst
      ? `踩到最大的坑是〈${worst.ch} ${worst.pat}〉${worst.name}——${worst.n} 人踩過。`
      : `12 個月沒踩到任何一個有紀錄的失敗模式。`;
    const url = location.origin + location.pathname;
    return `${head}\n${mid}\n\n你撐得到第幾個月？\n${url}`;
  }

  function shareBlock() {
    const wrap = node('div', null, 'slab share');
    wrap.appendChild(node('span', '把成績貼出去', 'label'));
    const ta = node('textarea');
    ta.readOnly = true;
    ta.rows = 5;
    ta.value = shareText();
    ta.setAttribute('aria-label', '可複製的成績文字');
    wrap.appendChild(ta);

    const row = node('div', null, 'row');
    const copy = node('button', null, 'next');
    copy.type = 'button';
    copy.appendChild(node('span', '複製'));
    const said = node('span', '', 'said');
    said.setAttribute('role', 'status');
    said.setAttribute('aria-live', 'polite');
    copy.addEventListener('click', async () => {
      // file:// 不是 secure context，navigator.clipboard 會丟例外，所以留 execCommand 後路。
      let ok = false;
      try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { /* 往下走 */ }
      if (!ok) { ta.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } }
      said.textContent = ok ? '已複製' : '複製失敗，請直接選取上面的文字';
    });
    row.appendChild(copy);

    const th = node('a', null, 'ghost');
    th.href = 'https://www.threads.net/intent/post?text=' + encodeURIComponent(shareText());
    th.rel = 'noopener noreferrer';
    th.target = '_blank';
    th.appendChild(node('span', '到 Threads 發文'));
    th.appendChild(icon('link', 16));
    row.appendChild(th);
    row.appendChild(said);
    wrap.appendChild(row);
    return wrap;
  }

  // --- 開場 -----------------------------------------------------------------
  function renderStart() {
    const b = $('startBtn');
    b.textContent = '';
    b.appendChild(node('span', '開始 12 個月'));
    b.appendChild(icon('arrow'));
    b.addEventListener('click', () => newGame());
  }

  document.addEventListener('keydown', e => {
    if (!$('round').hidden) {
      const opts = $('opts').querySelectorAll('button:not([disabled])');
      if (opts.length && e.key >= '1' && e.key <= '4') {
        const b = opts[+e.key - 1];
        if (b) { b.click(); e.preventDefault(); }
      }
    }
  });

  // --- 自我檢查（平衡模擬，重用真正的 settle()）-----------------------------
  function selftest() {
    const out = [];
    let failed = 0;
    const ok = (cond, msg) => { out.push((cond ? '  OK  ' : 'FAIL  ') + msg); if (!cond) failed++; };

    // 題庫結構
    const ids = new Set();
    for (const q of BANK.questions) {
      ok(!ids.has(q.id), `題目 id 不重複：${q.id}`); ids.add(q.id);
      ok(q.options.length === 4, `${q.id} 恰好 4 個選項（實際 ${q.options.length}）`);
      const tiers = q.options.map(o => o.tier);
      ok(tiers.indexOf('good') >= 0, `${q.id} 至少一個 good`);
      ok(tiers.filter(t => t === 'bad' || t === 'kill').length >= 1, `${q.id} 至少一個 bad/kill`);
      ok(tiers.filter(t => t === 'kill').length <= 1, `${q.id} 最多一個 kill`);
      if (tiers.indexOf('kill') >= 0) ok(!!q.warn && !!q.requires, `${q.id} kill 題必須有 warn 與 requires`);
      for (const o of q.options) {
        if (o.tier === 'bad' || o.tier === 'kill') ok(!!o.ref, `${q.id} / ${o.tier} 必須有 ref`);
        if (o.tier === 'good') ok(!!o.src, `${q.id} / good 必須有 src`);
        const r = o.src || o.ref;
        if (r) ok(r.cases && r.cases.length >= 1, `${q.id} 每個引用至少一個案例`);
      }
    }

    // draws 與 PHASE_MONTHS 必須一致，否則抽題數與月份對不上
    for (const ph of [1,2,3,4])
      ok(BANK.draws[ph] === PHASE_MONTHS[ph].length,
         `階段${ph} draws=${BANK.draws[ph]} 對上 ${PHASE_MONTHS[ph].length} 個月份`);

    // 旗標必須成對，否則後果題永遠不會出現
    const setFlags = new Set(), needFlags = new Set();
    for (const q of BANK.questions) {
      if (q.requires) needFlags.add(q.requires);
      for (const o of q.options) if (o.flag) setFlags.add(o.flag);
    }
    for (const f of needFlags) ok(setFlags.has(f), `旗標 ${f} 有題目點亮它`);
    for (const f of setFlags) ok(needFlags.has(f), `旗標 ${f} 有後果題用到它`);

    // 每個 (賽道, 階段) 的可抽題數
    for (const tk of Object.keys(BANK.tracks))
      for (const ph of [1,2,3,4]) {
        const n = BANK.questions.filter(q => q.phase === ph && !q.requires &&
          (!q.tracks || q.tracks.indexOf(tk) >= 0)).length;
        ok(n >= BANK.draws[ph] + 2, `${tk} 階段${ph} 可抽 ${n} 題（需 ≥ ${BANK.draws[ph] + 2}）`);
      }

    // 平衡：每賽道跑 200 次全好／全壞／全普通
    // 用真正的 pickQuestion 與 settle，所以旗標解鎖的後果題也會被跑到。
    const play = (tk, pick) => {
      const t = BANK.tracks[tk];
      const s = {unit: t.unit, cash: t.cash, users: t.users, mrr: t.mrr, fixed: t.fixed, churn: t.churn};
      const flags = new Set(), used = new Set(), seen = [];
      for (let m = 1; m <= 12; m++) {
        const q = pickQuestion(m, tk, flags, used);
        if (!q) break;
        used.add(q.id);
        seen.push(q.id);
        const opt = pick(q);
        if (!opt) continue;
        if (opt.flag) flags.add(opt.flag);
        if (opt.tier === 'kill') return {death: m, kill: true, s, seen};
        settle(s, opt.d);
        if (s.cash < 0) return {death: m, s, seen};
      }
      return {death: 0, s, seen};
    };
    const firstOf = tier => q => q.options.filter(o => o.tier === tier)[0] || q.options[0];
    const anyOf = q => q.options[Math.floor(Math.random() * q.options.length)];

    for (const tk of Object.keys(BANK.tracks)) {
      let bad = [], good = 0, alive = 0;
      for (let i = 0; i < 200; i++) {
        const b = play(tk, firstOf('bad'));
        if (b.death) bad.push(b.death);
        const g = play(tk, firstOf('good'));
        if (!g.death && g.s.mrr >= g.s.fixed) good++;
        if (!play(tk, anyOf).death) alive++;
      }
      const med = bad.length ? bad.slice().sort((x, y) => x - y)[Math.floor(bad.length / 2)] : 0;
      ok(bad.length >= 180, `${tk} 全壞路線 200 局中倒閉 ${bad.length} 局（需 ≥180）`);
      ok(med >= 5 && med <= 10, `${tk} 全壞路線倒閉中位數第 ${med} 個月（需 5–10）`);
      ok(good >= 190, `${tk} 全好路線 200 局中撐過 12 個月且 MRR ≥ 固定支出 ${good} 局（需 ≥190）`);
      // 亂選要有輸有贏 —— 結局必須由選擇決定，不是由起始數值決定。
      ok(alive >= 30 && alive <= 170, `${tk} 亂選 200 局存活 ${alive} 局（需 30–170）`);
    }

    out.unshift(`題庫 ${BANK.questions.length} 題 · 失敗 ${failed} 項\n`);
    $('stOut').textContent = out.join('\n');
    show('selftest');
  }

  renderStart();
  if (location.hash === '#selftest') selftest();
  else show('start');
})();
</script>
